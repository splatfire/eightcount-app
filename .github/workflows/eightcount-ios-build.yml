# Compiles the EightCount iOS app on GitHub's macOS machines (free for
# public repos), so build errors show up without a Mac. No signing: this
# only checks that the code compiles. Installing on an iPhone still happens
# in Xcode on your Mac (see eightcount/README.md).
name: EightCount iOS build

on:
  push:
    branches: [claude/nice-bardeen-84bg5p]
    paths:
      - "eightcount/**"
      - ".github/workflows/eightcount-ios-build.yml"
  workflow_dispatch:

# A newer push cancels the build of an older one.
concurrency:
  group: eightcount-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 27 (GitHub image is in public preview).
          - name: Xcode 27
            runner: xcode-27
          # Xcode 26 (default on macos-26), to make sure older setups build too.
          - name: Xcode 26
            runner: macos-26
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: eightcount
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EightCount.xcodeproj \
            -scheme EightCount \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Error and warning summary
        if: always()
        run: |
          echo "=== ERRORS ==="
          grep -E "error:" build.log | sort -u || true
          echo "=== WARNINGS (first 80) ==="
          grep -E "warning:" build.log | sort -u | head -80 || true

  # Runtime test: a UI test taps through the app in an iOS Simulator with a
  # generated test video (practice, loop, notes, takes, compare, analysis).
  # Screenshots: Actions run → Artifacts → ui-screenshots.
  uitest:
    name: UI test in Simulator (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 50
    defaults:
      run:
        working-directory: eightcount
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v ffmpeg || brew install ffmpeg

      - name: Make a 20 s test video (portrait, test pattern + tone)
        run: |
          ffmpeg -loglevel error -y \
            -f lavfi -i testsrc2=size=720x1280:rate=30 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest demo.mp4
          ls -la demo.mp4

      - name: Generate project and pick a simulator
        run: |
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for r in sorted((r for r in d if "iOS" in r), reverse=True):
              for dev in d[r]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Run UI test
        run: |
          set -o pipefail
          mkdir -p shots
          TEST_RUNNER_SEED_VIDEO="$PWD/demo.mp4" TEST_RUNNER_SHOTS_DIR="$PWD/shots" \
          xcodebuild test \
            -project EightCount.xcodeproj -scheme EightCount \
            -destination "id=$UDID" -resultBundlePath ui.xcresult \
            2>&1 | tee test.log | grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)|XCTAssert|Not found|crash" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Crash reports (if any)
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i eightcount | head -2); do
            echo "=== $f"; head -150 ~/Library/Logs/DiagnosticReports/"$f"
          done

      - name: Print screenshots (small, base64) for remote review
        if: always()
        run: |
          for f in shots/*.png; do
            [ -e "$f" ] || continue
            sips -Z 420 -s format jpeg -s formatOptions 35 "$f" --out small.jpg >/dev/null
            echo "SHOT_BEGIN $(basename "$f")"
            base64 -i small.jpg | fold -w 3000
            echo "SHOT_END"
          done

      - name: Save screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            eightcount/shots
            eightcount/ui.xcresult
          if-no-files-found: ignore
